name: Release

# A pushed tag v<version> (equal to package.json) → verify (read-only job: tag, manifest and CHANGELOG checks, typecheck, tests, audit of the shipped
# tree) → publish (the only job with the publishing permissions; installs with --ignore-scripts): a GitHub Release
# draft from the CHANGELOG section, then `npm stage publish` — public on npm once a maintainer approves it with 2FA; a
# re-run after the approval publishes the draft, a re-run while the version still waits fails at the stage step.
# `workflow_dispatch` with `tag` releases an existing tag with THIS workflow definition (a tag pushed earlier would
# otherwise run the workflow as it was at that tag).
# Publishing uses npm Trusted Publishing (OIDC): the package's trusted publisher on npmjs.com names this repository
# and this workflow file (no environment); the job holds `id-token: write` and no token secret exists. npm attaches
# the provenance attestation itself; `--provenance` stays explicit so a publish that cannot attest fails instead of
# shipping silently without one. The trusted publisher is stage-only: the job runs `npm stage publish`, and a version
# goes public only when a maintainer approves it on npmjs.com with 2FA — a compromised workflow cannot ship alone.
# Actions are pinned to full commit SHAs; Dependabot keeps the pins current.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release with the current workflow (v<version>)"
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Verify the tagged tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      # The same Node the publish job builds the release on; the engines floor (22) is ci.yml's matrix.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve the release tag
        run: echo "TAG=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Tag must be v<package.json version>
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error ::tag $TAG must be v$pkg (package.json version with the v prefix)"
            exit 1
          fi

      - name: server.json versions must equal package.json
        run: |
          node -e '
            const s = require("./server.json"); const v = require("./package.json").version;
            const seen = [s.version, ...(s.packages ?? []).map((p) => p.version)];
            if (seen.some((x) => x !== v)) { console.error(`server.json versions ${JSON.stringify(seen)} != package.json ${v}`); process.exit(1); }
            console.log(`server.json versions match ${v}`);
          '
      - name: CHANGELOG.md must have a section for this version
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error ::CHANGELOG.md has no section for [$v]"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  publish:
    name: Stage on npm + GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      # No dependency cache in the release build (npm's Trusted Publishing guidance); verify keeps its cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Staged publishing needs npm 11.15.0+; the release installs ONE exact version (this file's pinning policy) and checks
      # that the PATH runs it. Dependabot does not see this pin: raise it by hand within npm 11.
      - name: npm 11.20.0 (staged publishing, Trusted Publishing)
        env:
          NPM_PIN: 11.20.0
        run: |
          npm install -g --ignore-scripts "npm@$NPM_PIN"
          v="$(npm --version)"
          if [ "$v" != "$NPM_PIN" ]; then
            echo "::error ::npm $v runs, npm $NPM_PIN was installed — the pinned npm is not on the PATH"
            exit 1
          fi
          echo "npm $v"
      - name: Resolve the release tag
        run: echo "TAG=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - name: CHANGELOG.md must have a section for this version
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error ::CHANGELOG.md has no section for [$v]"
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run build

      # A DRAFT until the version is public on npm: a pending or rejected stage never leaves a published release for a
      # version nobody can install. A re-run after the approval publishes the draft.
      - name: GitHub Release from the CHANGELOG section — a draft until the npm version is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          v="$(node -p "require('./package.json').version")"
          public=0
          [ "$(npm view "$name@$v" version 2>/dev/null)" = "$v" ] && public=1
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$public" = 1 ]; then draft=--draft=false; else draft=; fi
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $draft
          elif [ "$public" = 1 ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # Staged, never published directly: the version waits on npmjs.com until a maintainer approves it with 2FA
      # (package page → Staged Packages → Approve, or `npm stage approve <stage-id>`). A re-run skips a version that is
      # already public; npm does not document a second stage of a version that waits for approval — approve or reject
      # that one before re-running. The last step on purpose: nothing after it is skipped when it fails.
      - name: Stage on npm (Trusted Publishing, provenance) unless this version is already public
        run: |
          set -o pipefail # the default bash of a run step has no pipefail: a failing stage behind tee would read as green
          name="$(node -p "require('./package.json').name")"
          v="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$v" version 2>/dev/null)" = "$v" ]; then
            echo "$name@$v is already on npm; skipping"
          else
            npm stage publish --provenance --access public --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/stage.log"
            {
              echo "### $name@$v is staged — not public until a maintainer approves it"
              echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID · commit $GITHUB_SHA"
              echo "Approve with 2FA: https://www.npmjs.com/package/$name → **Staged Packages** → **Approve**, or \`npm stage approve <stage-id>\`."
              echo '<details><summary>stage log (the stage id is in it)</summary>'
              echo
              echo '```'
              cat "$RUNNER_TEMP/stage.log"
              echo '```'
              echo '</details>'
              echo "Then re-run this workflow (or \`gh release edit $TAG --draft=false\`): the GitHub Release draft is published once the version is public."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
