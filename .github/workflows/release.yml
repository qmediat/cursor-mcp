name: Release

# A pushed tag v<version> (equal to package.json) → verify (read-only job: tag, manifest and CHANGELOG checks, typecheck, tests, audit of the shipped
# tree) → publish (the only job with the publishing permissions; installs with --ignore-scripts, skips a version
# already on npm so a re-run is safe) → GitHub Release from the CHANGELOG section (created or updated).
# `workflow_dispatch` with `tag` releases an existing tag with THIS workflow definition (a tag pushed earlier would
# otherwise run the workflow as it was at that tag).
# Publishing needs the npm publishing credential NPM_TOKEN (an npm "Automation" token with publish rights on
# @qmediat.io) visible to this repository, or npm Trusted Publishing configured for this workflow.
# Actions are pinned to full commit SHAs; Dependabot keeps the pins current.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release with the current workflow (v<version>)"
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Verify the tagged tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Resolve the release tag
        run: echo "TAG=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Tag must be v<package.json version>
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error ::tag $TAG must be v$pkg (package.json version with the v prefix)"
            exit 1
          fi

      - name: server.json versions must equal package.json
        run: |
          node -e '
            const s = require("./server.json"); const v = require("./package.json").version;
            const seen = [s.version, ...(s.packages ?? []).map((p) => p.version)];
            if (seen.some((x) => x !== v)) { console.error(`server.json versions ${JSON.stringify(seen)} != package.json ${v}`); process.exit(1); }
            console.log(`server.json versions match ${v}`);
          '
      - name: CHANGELOG.md must have a section for this version
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error ::CHANGELOG.md has no section for [$v]"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  publish:
    name: Publish to npm + GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Resolve the release tag
        run: echo "TAG=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - name: CHANGELOG.md must have a section for this version
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error ::CHANGELOG.md has no section for [$v]"
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run build

      # Resumable: a re-run after a failed later step skips a version that is already on the registry.
      - name: Publish to npm (provenance) unless this version is already published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          v="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$v" version 2>/dev/null)" = "$v" ]; then
            echo "$name@$v is already on npm; skipping publish"
          else
            npm publish --provenance --access public --ignore-scripts
          fi

      - name: GitHub Release from the CHANGELOG section (created or updated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
