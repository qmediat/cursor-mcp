name: MCP Registry

# Keeps the official MCP Registry (registry.modelcontextprotocol.io) in step with the releases: every run looks at the
# newest RELEASES_SEEN published GitHub Releases (drafts and prereleases left out before counting) and publishes each
# version npm serves and the registry does not list yet, oldest first — so a version whose npm approval comes after a
# later release, or after the default branch moved on, is still published by the next run. Each is the server.json of its
# own tag with the default branch's description (presentation only, checked against the registry's 100-character limit;
# a version the registry lists cannot be changed, so a corrected description reaches the versions published after it).
# Triggers: a release published, the Release workflow completed, a daily schedule (it reaches the registry after a
# maintainer approves a staged npm version, which fires no event) and by hand.
# One bad release never holds the others: a tag whose manifests disagree, an answer that cannot be read or a refused
# publish is said as an error, the rest go on, and the run ends red once they are done. Green with a notice: nothing to
# publish. The GitHub token goes to api.github.com only; npm and the registry are read without credentials.
# Login is GitHub Actions OIDC: the registry grants io.github.<repository owner>/* to the token, so no secret exists.
# mcp-publisher is pinned by version and by the sha256 of its release tarball (raised by hand, as the npm pin is).

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mcp-registry
  cancel-in-progress: false

env:
  PUBLISHER_VERSION: "1.8.1"
  PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  REGISTRY: https://registry.modelcontextprotocol.io
  RELEASES_SEEN: "10"

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The default branch, with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: The versions to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/publish" n=0 errors=0 && mkdir -p "$out"
          # the probes never fail: a transport error is status 000, said by the caller; only api.github.com gets the token
          github() { curl -sS --max-time 30 -o "$2" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/$1" || true; }
          public() { curl -sS --max-time 20 -o "$2" -w '%{http_code}' "$1" || true; }
          listed() { public "$REGISTRY/v0/servers/${1/\//%2F}/versions/$2" /dev/null; } # $1 name, $2 version → 200 / 404 / …
          field() { jq -r "$1 // \"\"" "$2" 2> /dev/null || true; } # $1 jq path, $2 file → the value, empty when unreadable
          declare -f public listed > "$RUNNER_TEMP/probes.sh"         # the publish step asks the same way
          bad() { echo "::error::$*"; errors=$((errors + 1)); return 1; }
          description="$(field .description server.json)" server="$(field .name server.json)"
          chars="$(jq -r '(.description // "") | length' server.json 2> /dev/null || echo 0)" # characters, whatever the locale
          if [ -z "$description" ] || [ "$chars" -gt 100 ] || [ -z "$server" ]; then
            echo "::error::the default branch's server.json needs a name and a 1–100 character description (it has $chars)"
            exit 1
          fi
          code="$(github "repos/$REPO/releases?per_page=100" "$RUNNER_TEMP/releases.json")"
          [ "$code" = 200 ] || { echo "::error::GitHub answered $code for the releases"; exit 1; }
          tags="$(jq -r --argjson n "$RELEASES_SEEN" '[.[] | select((.draft | not) and (.prerelease | not)) | .tag_name][:$n] | reverse | .[]' \
            "$RUNNER_TEMP/releases.json")" || { echo "::error::the releases cannot be read"; exit 1; }
          # $1 tag → 0 planned or left out (said), 1 a problem (said by bad); every command is tested, none ends the loop
          plan_tag() {
            local tag="$1" version="${1#v}" s="$RUNNER_TEMP/s.json" p="$RUNNER_TEMP/p.json" name pkg mcp code
            if ! git show "$tag:server.json" > "$s" 2> /dev/null || ! git show "$tag:package.json" > "$p" 2> /dev/null; then
              echo "::notice::$tag has no server.json or package.json — left out"
              return 0
            fi
            jq empty "$s" "$p" > /dev/null 2>&1 || { bad "$tag: its server.json or package.json is not JSON"; return; }
            name="$(field .name "$s")" pkg="$(field .name "$p")" mcp="$(field .mcpName "$p")"
            if [ -z "$mcp" ]; then
              echo "::notice::$tag's package.json has no mcpName (a release from before the registry) — left out"
              return 0
            fi
            [ "$mcp" = "$name" ] || { bad "$tag: package.json's mcpName $mcp is not server.json's name ${name:-(none)}"; return; }
            [ "$name" = "$server" ] || { bad "$tag is server $name, the default branch $server — publish it by hand"; return; }
            if [ "$(field .version "$s")" != "$version" ] || [ "$(field .version "$p")" != "$version" ]; then
              bad "$tag: server.json and package.json must both be version $version"
              return
            fi
            jq -e --arg v "$version" --arg p "$pkg" '(.packages | length) > 0 and all(.packages[]; .version == $v)
              and any(.packages[]; .registryType == "npm" and .identifier == $p)' "$s" > /dev/null 2>&1 \
              || { bad "$tag: every package in server.json must be version $version, one of them npm's $pkg"; return; }
            code="$(public "https://registry.npmjs.org/${pkg/\//%2F}/$version" "$RUNNER_TEMP/npm.json")"
            case "$code" in
              404) echo "::notice::npm does not serve $pkg@$version yet — not published now"; return 0 ;;
              200) [ "$(field .mcpName "$RUNNER_TEMP/npm.json")" = "$name" ] || { bad "npm's $pkg@$version has no mcpName $name"; return; } ;;
              *) bad "npm answered $code for $pkg@$version"; return ;;
            esac
            code="$(listed "$name" "$version")"
            case "$code" in
              200) echo "::notice::the registry already lists $name $version"; return 0 ;;
              404) ;;
              *) bad "the registry answered $code for $name $version"; return ;;
            esac
            # written beside, moved in whole: the publish step never sees a half-written file
            if ! jq --arg d "$description" '.description = $d' "$s" > "$RUNNER_TEMP/rewrite.json" 2> /dev/null \
              || ! mv "$RUNNER_TEMP/rewrite.json" "$out/$(printf '%05d' "$((n + 1))")-$version.json"; then
              rm -f "$RUNNER_TEMP/rewrite.json"
              bad "$tag: its server.json cannot be rewritten"
              return
            fi
            n=$((n + 1))
            echo "to publish: $name $version"
          }
          [ -n "$tags" ] || echo "::notice::no published release yet — nothing published"
          for tag in $tags; do plan_tag "$tag" || true; done
          { echo "errors=$errors"; [ "$n" = 0 ] || echo "publish=true"; } >> "$GITHUB_OUTPUT"

      - name: Install mcp-publisher (pinned)
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      - name: Log in (GitHub Actions OIDC)
        if: steps.plan.outputs.publish == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc --registry "$REGISTRY"'

      - name: Publish, oldest first; each version listed afterwards
        id: publish
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -uo pipefail # the step shell is bash -e: every command that may fail below is tested, never left to end the loop
          . "$RUNNER_TEMP/probes.sh"
          refused=0
          for f in "$RUNNER_TEMP"/publish/*.json; do
            name="$(jq -r .name "$f")" version="$(jq -r .version "$f")"
            if ! "$RUNNER_TEMP/mcp-publisher" publish "$f"; then
              echo "::error::the registry refused $name $version — the newer versions go on"
              refused=$((refused + 1))
              continue
            fi
            for wait in 0 5 10 20; do # the listing may trail the publish (35 s a version)
              sleep "$wait"
              code="$(listed "$name" "$version")"
              [ "$code" != 200 ] || break
            done
            if [ "$code" = 200 ]; then echo "listed: $name $version"; else
              echo "::warning::$name $version published, not listed 35 s later (the registry answers $code) — the next run checks it"
            fi
          done
          echo "refused=$refused" >> "$GITHUB_OUTPUT"

      - name: A release could not be checked or published
        if: always() && (steps.plan.outputs.errors != '0' || (steps.publish.outputs.refused != '' && steps.publish.outputs.refused != '0'))
        env:
          ERRORS: ${{ steps.plan.outputs.errors }}
          REFUSED: ${{ steps.publish.outputs.refused }}
        run: |
          echo "::error::${ERRORS:-?} release(s) could not be checked, ${REFUSED:-0} publish(es) refused — the errors above say which"
          exit 1
